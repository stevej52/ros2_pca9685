# The set-up the original version of this package was written for: an RC car
# with an ESC on output 0, a front steering servo on output 1 and a rear
# steering servo on output 2 that mirrors the front one (4-wheel steering).
# Everything is driven from /cmd_vel, so teleop_twist_joy and Nav2 work.
#
# The steering numbers reproduce the old hard-coded values: 100 Hz, steering
# 30-135 around 85, angular.z scaled by (85 - 30) / 3. The throttle is now a
# proper ESC channel: the old 65-125 "degrees" around 90 were pulses of about
# 1292-1792 us around 1500 us, which is what the limits below give.
/**:
  ros__parameters:
    i2c_bus: 1
    i2c_address: 64
    pwm_frequency: 100.0
    twist_topic: cmd_vel
    channels: [throttle, steering, rear_steering]

    throttle:
      channel: 0
      type: continuous
      min_pulse_us: 1000.0       # full reverse
      neutral_pulse_us: 1500.0   # stop
      max_pulse_us: 2000.0       # full forward
      min_limit: -0.42           # -0.42 * 500 us = about 1292 us, the old lower limit
      max_limit: 0.58            #  0.58 * 500 us = about 1792 us, the old upper limit
      home: 0.0                  # neutral
      timeout: 0.5               # back to neutral if cmd_vel stops (e.g. teleop died)
      twist:
        linear_x: 1.0            # throttle per m/s: 0.5 m/s = 0.5 = 1750 us
      esc:
        # What the ESC must see after power-up before it drives the motor.
        # The old code held neutral for a second; two seconds is safer.
        arming:
          values: [0.0]
          durations: [2.0]
        # Other ESCs want other things. Replace the two lines above with one
        # of these if yours does not arm:
        #   values: [-1.0, 0.0]          # minimum throttle first, then neutral
        #   durations: [2.0, 0.5]
        #   values: [0.0, 0.05, 0.0]     # neutral, a small nudge, neutral
        #   durations: [2.5, 0.5, 0.5]
        # Commands this close to zero are sent as neutral instead:
        deadband: 0.02
        # If the car only brakes when you pull back and needs a second pull
        # to reverse, describe the first pull here and the node does it for
        # you: a short reverse tap, neutral, then the reverse command.
        #   to_reverse:
        #     values: [-0.3, 0.0]
        #     durations: [0.15, 0.15]
        # If the motor only starts moving at, say, 12 % throttle, set
        # forward_start: 0.12 (and reverse_start) and small commands will
        # still move the car.

    steering:
      channel: 1
      home: 85.0                 # straight ahead
      home_on_start: true
      min_limit: 30.0
      max_limit: 135.0
      timeout: 0.5
      twist:
        angular_z: -18.33        # positive angular.z (turn left) lowers the angle

    rear_steering:
      channel: 2
      home: 85.0
      home_on_start: true
      min_limit: 35.0            # mirror image of the front limits around 85
      max_limit: 140.0
      timeout: 0.5
      twist:
        angular_z: 18.33         # opposite direction to the front servo
